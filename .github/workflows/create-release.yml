name: Build APK

# Builds an installable release APK (minified with R8, signed) and attaches it
# to the run as a downloadable artifact. Run it by hand from the Actions tab
# ("Run workflow") or it runs on every push to main.
#
# Signing: if the repository has the secrets KEYSTORE_FILE (base64 of a .jks),
# KEY_ALIAS, KEYSTORE_PASSWORD and KEY_PASSWORD, they are used, and every build
# can be installed over the previous one. Without them a throwaway key is
# generated for that run, and the previous build must be uninstalled first.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'images/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare signing key
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$KEYSTORE_FILE" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Using the signing key from the repository secrets."
            echo "$KEYSTORE_FILE" | base64 --decode > "$RUNNER_TEMP/ks/key.jks"
            {
              echo "SIGN_ALIAS=$KEY_ALIAS"
              echo "SIGN_STORE_PASS=$KEYSTORE_PASSWORD"
              echo "SIGN_KEY_PASS=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "Signing secrets missing or incomplete: using a throwaway key for this build."
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/ks/key.jks" \
              -alias nobook -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass nobook-test -keypass nobook-test \
              -dname "CN=Nobook Opt"
            {
              echo "SIGN_ALIAS=nobook"
              echo "SIGN_STORE_PASS=nobook-test"
              echo "SIGN_KEY_PASS=nobook-test"
            } >> "$GITHUB_ENV"
          fi

      - name: Sign APK
        run: |
          set -e
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          UNSIGNED_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

          # Fail with a clear message instead of a confusing apksigner error.
          [ -f "$UNSIGNED_APK" ] || { echo "No release APK found"; ls -R app/build/outputs/apk; exit 1; }
          [ -f "$RUNNER_TEMP/ks/key.jks" ] || { echo "Signing key file is missing"; exit 1; }
          [ -n "$SIGN_ALIAS" ] || { echo "Signing key alias is empty"; exit 1; }
          [ -n "$SIGN_STORE_PASS" ] || { echo "Keystore password is empty"; exit 1; }

          echo "Signing $UNSIGNED_APK with key alias '$SIGN_ALIAS'"
          # Passwords are read from environment variables (env:NAME) so quoting
          # and special characters in them cannot break the command line.
          "${BUILD_TOOLS_DIR}apksigner" sign \
            --ks "$RUNNER_TEMP/ks/key.jks" \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass env:SIGN_STORE_PASS \
            --key-pass env:SIGN_KEY_PASS \
            --out nobook-opt.apk \
            "$UNSIGNED_APK"
          "${BUILD_TOOLS_DIR}apksigner" verify nobook-opt.apk

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nobook-opt-apk
          path: nobook-opt.apk
          retention-days: 30
